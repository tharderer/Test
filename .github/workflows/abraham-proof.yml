name: Abraham Modular Proof
on:
  push:
    branches: [abraham-modular-proof]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: abraham-modular-proof-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      PYTHONUNBUFFERED: '1'
      LIBGL_ALWAYS_SOFTWARE: 'true'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install test and headless rendering dependencies
        run: |
          python -m pip install 'pytest>=8,<10'
          sudo apt-get update
          sudo apt-get install --yes libxi6 libxrender1 libxkbcommon0 libsm6 libice6 libgl1 libegl1 libgl1-mesa-dri xvfb xauth
      - name: Restore Blender 4.5.13 download cache
        uses: actions/cache@v4
        with:
          path: .tools/blender-4.5.13-linux-x64
          key: abraham-ubuntu24-blender-4.5.13
      - name: Build and verify the actual proof once
        run: |
          set -o pipefail
          xvfb-run -a make verify 2>&1 | tee build.log
      - name: Package and test the phone viewer
        run: |
          npm install --no-audit --no-fund
          npx playwright install chromium
          node scripts/package_viewer.mjs
          node scripts/smoke_viewer.mjs
      - name: Preserve build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: abraham-build-diagnostics
          path: |
            build.log
            assets/build/reports/
            assets/build/source-quality/mantle_skinned.glb
            assets/source/staff_source.glb
          if-no-files-found: warn
          retention-days: 7
      - name: Upload validated proof
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: abraham-modular-proof
          path: |
            delivery/
            abraham_upgrade_proof/
            assets/build/mobile/
            assets/build/source-quality/
            assets/build/reports/
          if-no-files-found: error
          retention-days: 7
