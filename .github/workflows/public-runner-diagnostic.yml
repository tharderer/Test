name: Public Runner Diagnostic

on:
  issues:
    types: [opened]

permissions:
  contents: read
  issues: write

jobs:
  prove-public-runner:
    if: >
      github.actor == 'tharderer' &&
      github.event.issue.user.login == 'tharderer' &&
      github.event.issue.title == '[PUBLIC RUNNER TEST]'
    runs-on: ubuntu-latest
    steps:
      - name: Confirm runner allocation
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh issue comment "${{ github.event.issue.number }}" \
            --repo "${{ github.repository }}" \
            --body "Public GitHub-hosted runner executed successfully."
