name: RunPod Migration Status

on:
  workflow_dispatch:
  issues:
    types: [opened]

permissions:
  contents: read
  issues: write

jobs:
  inspect-migration:
    if: >
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'issues' &&
       github.actor == 'tharderer' &&
       github.event.issue.user.login == 'tharderer' &&
       github.event.issue.title == '[RUNPOD MIGRATION] STATUS')
    runs-on: ubuntu-latest
    steps:
      - name: Validate credential
        env:
          RUNPOD_API_KEY: ${{ secrets.RUNPOD_API_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          [[ -n "$RUNPOD_API_KEY" ]] || { echo "::error::Missing RUNPOD_API_KEY"; exit 2; }

      - name: List safe Abraham Pod metadata
        env:
          RUNPOD_API_KEY: ${{ secrets.RUNPOD_API_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error \
            --url "https://api.runpod.io/v2/pods" \
            --header "Authorization: Bearer $RUNPOD_API_KEY" \
            --output /tmp/pods.json

          jq '
            def podlist:
              if type == "array" then .
              elif (.items? | type) == "array" then .items
              elif (.data? | type) == "array" then .data
              elif (.pods? | type) == "array" then .pods
              else [] end;
            podlist
            | map(select(
                (.id == "togka5pqf0efbh") or
                ((.name // "") | ascii_downcase | contains("abraham"))
              ))
            | map({
                id,
                name,
                desiredStatus,
                status,
                gpuCount,
                machineId,
                createdAt,
                lastStartedAt,
                lastStatusChange,
                volumeInGb,
                volumeMountPath,
                costPerHr
              })
          ' /tmp/pods.json

      - name: Close status request
        if: success() && github.event_name == 'issues'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh issue close "${{ github.event.issue.number }}" \
            --repo "${{ github.repository }}" \
            --comment "RunPod migration status query completed."
