name: RunPod Migration Status

on:
  workflow_dispatch:
  issues:
    types: [opened]

permissions:
  contents: read
  issues: write

jobs:
  inspect-migration:
    if: >
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'issues' &&
       github.actor == 'tharderer' &&
       github.event.issue.user.login == 'tharderer' &&
       github.event.issue.title == '[RUNPOD MIGRATION] STATUS')
    runs-on: ubuntu-latest
    steps:
      - name: Validate credential
        env:
          RUNPOD_API_KEY: ${{ secrets.RUNPOD_API_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          [[ -n "$RUNPOD_API_KEY" ]] || { echo "::error::Missing RUNPOD_API_KEY"; exit 2; }

      - name: List safe Abraham Pod metadata
        env:
          RUNPOD_API_KEY: ${{ secrets.RUNPOD_API_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error \
            --url "https://api.runpod.io/v2/pods" \
            --header "Authorization: Bearer $RUNPOD_API_KEY" \
            --output /tmp/pods.json

          jq '
            def podlist:
              if type == "array" then .
              elif (.items? | type) == "array" then .items
              elif (.data? | type) == "array" then .data
              elif (.pods? | type) == "array" then .pods
              else [] end;
            podlist
            | map(select(
                (.id == "togka5pqf0efbh") or
                (.id == "f72o8q67mc0lr7") or
                ((.name // "") | ascii_downcase | contains("abraham"))
              ))
            | map({
                id,
                name,
                desiredStatus,
                status,
                gpuCount,
                machineId,
                createdAt,
                lastStartedAt,
                lastStatusChange,
                volumeInGb,
                volumeMountPath,
                costPerHr
              })
          ' /tmp/pods.json

      - name: Inspect replacement safe runtime metadata
        env:
          RUNPOD_API_KEY: ${{ secrets.RUNPOD_API_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          POD_ID="f72o8q67mc0lr7"
          curl --fail --silent --show-error \
            --url "https://rest.runpod.io/v1/pods/$POD_ID" \
            --header "Authorization: Bearer $RUNPOD_API_KEY" \
            --output /tmp/pod.json
          jq '{
            id,
            name,
            desiredStatus,
            gpuCount,
            machineId,
            memoryInGb,
            vcpuCount,
            volumeInGb,
            volumeMountPath,
            containerDiskInGb,
            imageName,
            dockerArgs,
            ports,
            templateId,
            publicIp,
            portMappings,
            createdAt,
            lastStartedAt,
            lastStatusChange,
            costPerHr
          }' /tmp/pod.json


      - name: Verify migrated workspace through Jupyter
        env:
          RUNPOD_API_KEY: ${{ secrets.RUNPOD_API_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          POD_ID="f72o8q67mc0lr7"
          BASE="https://$POD_ID-8888.proxy.runpod.net"

          curl --fail --silent --show-error \
            --url "https://rest.runpod.io/v1/pods/$POD_ID" \
            --header "Authorization: Bearer $RUNPOD_API_KEY" \
            --output /tmp/pod-for-jupyter.json

          JUPYTER_PASSWORD="$(jq -r '.env.JUPYTER_PASSWORD // empty' /tmp/pod-for-jupyter.json)"
          if [[ -z "$JUPYTER_PASSWORD" ]]; then
            echo "::error::Replacement Pod has no JUPYTER_PASSWORD environment value"
            exit 2
          fi

          curl --silent --show-error --location \
            --cookie-jar /tmp/jupyter.cookies \
            "$BASE/login" \
            --output /tmp/jupyter-login.html

          XSRF="$(awk '$6 == "_xsrf" {print $7}' /tmp/jupyter.cookies | tail -1)"
          if [[ -z "$XSRF" ]]; then
            echo "::error::Could not obtain Jupyter XSRF cookie"
            exit 3
          fi

          curl --silent --show-error \
            --cookie /tmp/jupyter.cookies \
            --cookie-jar /tmp/jupyter.cookies \
            --request POST \
            "$BASE/login?next=%2Flab" \
            --data-urlencode "_xsrf=$XSRF" \
            --data-urlencode "password=$JUPYTER_PASSWORD" \
            --output /tmp/jupyter-login-post.html

          api_code="$(
            curl --silent --show-error \
              --cookie /tmp/jupyter.cookies \
              --output /tmp/jupyter-root.json \
              --write-out "%{http_code}" \
              "$BASE/api/contents?content=1"
          )"
          echo "JUPYTER_CONTENTS_HTTP $api_code"
          if [[ "$api_code" != "200" ]]; then
            echo "::error::Authenticated Jupyter contents request failed"
            exit 4
          fi

          echo "JUPYTER_ROOT_API_PATH $(jq -r '.path // "<unknown>"' /tmp/jupyter-root.json)"
          if jq -e '.content[]? | select(.name == "workspace" and .type == "directory")' /tmp/jupyter-root.json >/dev/null; then
            echo "JUPYTER_ROOT_HAS_WORKSPACE yes"
            workspace_code="$(
              curl --silent --show-error \
                --cookie /tmp/jupyter.cookies \
                --output /tmp/jupyter-workspace.json \
                --write-out "%{http_code}" \
                "$BASE/api/contents/workspace?content=1"
            )"
            echo "JUPYTER_WORKSPACE_HTTP $workspace_code"
            TARGET_JSON=/tmp/jupyter-workspace.json
          else
            echo "JUPYTER_ROOT_HAS_WORKSPACE no"
            TARGET_JSON=/tmp/jupyter-root.json
          fi

          for p in "rdc-entrypoint.sh" "pre_start_rdc.sh" "rdc-watchdog.sh" "rdc-auth-sync.sh" "runpod-supervisor.sh" "comfy-watchdog.sh" "factory-runtime" "bible-world-game" ".rdc-auth-backup"; do
            if jq -e --arg p "$p" '.content[]? | select(.name == $p)' "$TARGET_JSON" >/dev/null; then
              echo "WORKSPACE_PATH $p = present"
            else
              echo "WORKSPACE_PATH $p = absent"
            fi
          done

      - name: Compare original and replacement API schema
        env:
          RUNPOD_API_KEY: ${{ secrets.RUNPOD_API_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          for POD_ID in "togka5pqf0efbh" "f72o8q67mc0lr7"; do
            curl --fail --silent --show-error \
              --url "https://rest.runpod.io/v1/pods/$POD_ID" \
              --header "Authorization: Bearer $RUNPOD_API_KEY" \
              --output "/tmp/$POD_ID.json"
            echo "TOP_LEVEL_KEYS $POD_ID"
            jq -r 'keys[]' "/tmp/$POD_ID.json" | sort
          done

      - name: Check bootstrap signatures in replacement logs
        env:
          RUNPOD_API_KEY: ${{ secrets.RUNPOD_API_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          POD_ID="f72o8q67mc0lr7"
          set +e
          curl --silent --show-error --max-time 8 \
            --url "https://api.runpod.io/v2/pods/$POD_ID/logs" \
            --header "Authorization: Bearer $RUNPOD_API_KEY" \
            --output /tmp/podlogs.txt
          rc=$?
          set -e
          if [[ $rc -ne 0 && $rc -ne 28 ]]; then
            echo "::warning::Pod log stream request failed with curl code $rc"
          fi
          touch /tmp/podlogs.txt
          for p in "rdc-entrypoint.sh" "pre_start_rdc.sh" "rdc-watchdog" "rdc-auth-sync" "runpod-supervisor" "comfy-watchdog" "Desktop Commander"; do
            if grep -Fqi "$p" /tmp/podlogs.txt; then
              echo "BOOTSTRAP_SIGNATURE $p = present"
            else
              echo "BOOTSTRAP_SIGNATURE $p = absent"
            fi
          done
          if grep -Fqi "No such file or directory" /tmp/podlogs.txt; then
            echo "BOOTSTRAP_ERROR no-such-file = present"
          else
            echo "BOOTSTRAP_ERROR no-such-file = absent"
          fi
          for p in "rdc-entrypoint.sh" "pre_start_rdc.sh" "pre_start.sh" "rdc-watchdog.sh" "rdc-auth-sync.sh" "runpod-supervisor.sh"; do
            if grep -Ei "(No such file or directory.*$p|$p.*No such file or directory)" /tmp/podlogs.txt >/dev/null; then
              echo "MISSING_PATH $p = yes"
            else
              echo "MISSING_PATH $p = no"
            fi
          done
          echo "LOG_BYTES $(wc -c < /tmp/podlogs.txt)"

      - name: Close status request
        if: success() && github.event_name == 'issues'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh issue close "${{ github.event.issue.number }}" \
            --repo "${{ github.repository }}" \
            --comment "RunPod migration status query completed."
