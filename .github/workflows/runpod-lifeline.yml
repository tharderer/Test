name: RunPod Lifeline

on:
  workflow_dispatch:
  issues:
    types: [opened]
  schedule:
    - cron: "*/5 * * * *"

permissions:
  contents: read
  issues: write

jobs:
  start-runpod:
    if: >
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'schedule' ||
      (github.event_name == 'issues' &&
       github.actor == 'tharderer' &&
       github.event.issue.user.login == 'tharderer' &&
       github.event.issue.title == '[RUNPOD RECOVERY] START')
    runs-on: ubuntu-latest
    steps:
      - name: Determine recovery request
        id: gate
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" == "schedule" ]]; then
            issue_number="$(
              gh issue list \
                --repo "${{ github.repository }}" \
                --state open \
                --limit 100 \
                --json number,title,author \
                --jq '[.[] | select(.title == "[RUNPOD RECOVERY] START" and .author.login == "tharderer")] | sort_by(.number) | last | .number // empty'
            )"
            if [[ -z "$issue_number" ]]; then
              echo "armed=false" >> "$GITHUB_OUTPUT"
              echo "No open RunPod recovery request; scheduled retry is idle."
              exit 0
            fi
            echo "armed=true" >> "$GITHUB_OUTPUT"
            echo "issue_number=$issue_number" >> "$GITHUB_OUTPUT"
          elif [[ "${{ github.event_name }}" == "issues" ]]; then
            echo "armed=true" >> "$GITHUB_OUTPUT"
            echo "issue_number=${{ github.event.issue.number }}" >> "$GITHUB_OUTPUT"
          else
            echo "armed=true" >> "$GITHUB_OUTPUT"
            echo "issue_number=" >> "$GITHUB_OUTPUT"
          fi

      - name: Mark public recovery runner started
        if: steps.gate.outputs.armed == 'true' && github.event_name == 'issues'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh issue comment "${{ steps.gate.outputs.issue_number }}" \
            --repo "${{ github.repository }}" \
            --body "Public recovery runner started. Validating the RunPod credential and requesting Pod start."

      - name: Validate recovery credential
        if: steps.gate.outputs.armed == 'true'
        env:
          RUNPOD_API_KEY: ${{ secrets.RUNPOD_API_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "$RUNPOD_API_KEY" ]]; then
            echo "::error::Missing repository secret RUNPOD_API_KEY"
            exit 2
          fi

      - name: Inspect safe Pod state
        if: steps.gate.outputs.armed == 'true'
        env:
          RUNPOD_API_KEY: ${{ secrets.RUNPOD_API_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          POD_ID="f72o8q67mc0lr7"
          curl --fail --silent --show-error \
            --url "https://rest.runpod.io/v1/pods/$POD_ID" \
            --header "Authorization: Bearer $RUNPOD_API_KEY" \
            --output /tmp/runpod-pod.json
          jq '{
            id,
            name,
            desiredStatus,
            gpuCount,
            machineId,
            lastStatusChange,
            volumeInGb,
            volumeMountPath,
            costPerHr
          }' /tmp/runpod-pod.json

      - name: Start RunPod or keep retry armed
        if: steps.gate.outputs.armed == 'true'
        id: start
        env:
          RUNPOD_API_KEY: ${{ secrets.RUNPOD_API_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          POD_ID="f72o8q67mc0lr7"

          current_status="$(jq -r '.desiredStatus // empty' /tmp/runpod-pod.json)"
          if [[ "$current_status" == "RUNNING" ]]; then
            echo "result=already-running" >> "$GITHUB_OUTPUT"
            echo "Pod $POD_ID is already RUNNING."
            exit 0
          fi

          http_code="$(
            curl --silent --show-error \
              --request POST \
              --url "https://rest.runpod.io/v1/pods/$POD_ID/start" \
              --header "Authorization: Bearer $RUNPOD_API_KEY" \
              --output /tmp/runpod-start.json \
              --write-out "%{http_code}"
          )"

          if [[ "$http_code" =~ ^2 ]]; then
            echo "result=started" >> "$GITHUB_OUTPUT"
            echo "RunPod start request accepted for $POD_ID (HTTP $http_code)"
            exit 0
          fi

          error_message=""
          if jq -e . /tmp/runpod-start.json >/dev/null 2>&1; then
            error_message="$(jq -r '.error // .message // empty' /tmp/runpod-start.json)"
          fi

          if [[ "$error_message" == *"not enough free GPUs on the host machine"* ]]; then
            echo "result=gpu-unavailable" >> "$GITHUB_OUTPUT"
            echo "GPU is currently unavailable on the Pod's host. Recovery remains armed for the next scheduled retry."
            exit 0
          fi

          echo "::error::RunPod start request failed for $POD_ID (HTTP $http_code)"
          if jq -e . /tmp/runpod-start.json >/dev/null 2>&1; then
            jq 'if type == "object" then {
              error: .error,
              message: .message,
              status: .status,
              statusCode: .statusCode,
              code: .code
            } else {responseType: type} end' /tmp/runpod-start.json
          else
            echo "RunPod returned a non-JSON error body; body suppressed for security."
          fi
          exit 22

      - name: Record GPU-unavailable retry state
        if: steps.start.outputs.result == 'gpu-unavailable' && github.event_name == 'issues'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh issue comment "${{ steps.gate.outputs.issue_number }}" \
            --repo "${{ github.repository }}" \
            --body "RunPod is reachable, but this Pod's original host currently has no free GPU. Recovery remains armed and will retry automatically every five minutes."

      - name: Close completed recovery requests
        if: steps.start.outputs.result == 'started' || steps.start.outputs.result == 'already-running'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t issues < <(
            gh issue list \
              --repo "${{ github.repository }}" \
              --state open \
              --limit 100 \
              --json number,title,author \
              --jq '.[] | select(.title == "[RUNPOD RECOVERY] START" and .author.login == "tharderer") | .number'
          )
          for issue_number in "${issues[@]}"; do
            gh issue close "$issue_number" \
              --repo "${{ github.repository }}" \
              --comment "RunPod recovery completed: Pod f72o8q67mc0lr7 is running or its start request was accepted."
          done
