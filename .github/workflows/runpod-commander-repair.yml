name: RunPod Commander Repair

on:
  workflow_dispatch:
  issues:
    types: [opened]

permissions:
  contents: read
  issues: write

jobs:
  repair-commander:
    if: >
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'issues' &&
       github.actor == 'tharderer' &&
       github.event.issue.user.login == 'tharderer' &&
       github.event.issue.title == '[RUNPOD MIGRATION] REPAIR COMMANDER')
    runs-on: ubuntu-latest
    steps:
      - name: Authenticate to migrated Jupyter
        env:
          RUNPOD_API_KEY: ${{ secrets.RUNPOD_API_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          [[ -n "$RUNPOD_API_KEY" ]] || { echo "::error::Missing RUNPOD_API_KEY"; exit 2; }

          POD_ID="f72o8q67mc0lr7"
          BASE="https://$POD_ID-8888.proxy.runpod.net"

          curl --fail --silent --show-error \
            --url "https://rest.runpod.io/v1/pods/$POD_ID" \
            --header "Authorization: Bearer $RUNPOD_API_KEY" \
            --output /tmp/pod.json

          JUPYTER_PASSWORD="$(jq -r '.env.JUPYTER_PASSWORD // empty' /tmp/pod.json)"
          [[ -n "$JUPYTER_PASSWORD" ]] || { echo "::error::Missing Jupyter password in Pod environment"; exit 3; }

          curl --silent --show-error --location \
            --cookie-jar /tmp/jupyter.cookies \
            "$BASE/login" \
            --output /tmp/login.html

          XSRF="$(awk '$6 == "_xsrf" {print $7}' /tmp/jupyter.cookies | tail -1)"
          [[ -n "$XSRF" ]] || { echo "::error::Could not obtain Jupyter XSRF cookie"; exit 4; }

          curl --silent --show-error \
            --cookie /tmp/jupyter.cookies \
            --cookie-jar /tmp/jupyter.cookies \
            --request POST \
            "$BASE/login?next=%2Flab" \
            --data-urlencode "_xsrf=$XSRF" \
            --data-urlencode "password=$JUPYTER_PASSWORD" \
            --output /tmp/login-post.html

          code="$(
            curl --silent --show-error \
              --cookie /tmp/jupyter.cookies \
              --output /tmp/root.json \
              --write-out "%{http_code}" \
              "$BASE/api/contents?content=0"
          )"
          [[ "$code" == "200" ]] || { echo "::error::Jupyter authentication failed"; exit 5; }

          kernel_code="$(
            curl --silent --show-error \
              --cookie /tmp/jupyter.cookies \
              --cookie-jar /tmp/jupyter.cookies \
              --header "X-XSRFToken: $XSRF" \
              --header "Content-Type: application/json" \
              --request POST \
              --data '{"name":"python3"}' \
              --output /tmp/kernel.json \
              --write-out "%{http_code}" \
              "$BASE/api/kernels"
          )"
          [[ "$kernel_code" =~ ^2 ]] || { echo "::error::Could not create Jupyter kernel (HTTP $kernel_code)"; exit 6; }

          KERNEL_ID="$(jq -r '.id // empty' /tmp/kernel.json)"
          [[ -n "$KERNEL_ID" ]] || { echo "::error::Jupyter kernel ID missing"; exit 7; }

          echo "JUPYTER_BASE=$BASE" >> "$GITHUB_ENV"
          echo "JUPYTER_KERNEL_ID=$KERNEL_ID" >> "$GITHUB_ENV"
          echo "JUPYTER_XSRF=$XSRF" >> "$GITHUB_ENV"
          echo "Authenticated Jupyter recovery channel established."

      - name: Inspect and conditionally launch Commander recovery
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --quiet websocket-client
          cat >/tmp/jupyter_repair.py <<'PY'
          import os, json, uuid, datetime, time
          import websocket

          base = os.environ["JUPYTER_BASE"]
          kid = os.environ["JUPYTER_KERNEL_ID"]

          cookies = []
          with open("/tmp/jupyter.cookies", "r", encoding="utf-8") as f:
              for raw in f:
                  line = raw.strip()
                  if not line:
                      continue
                  if line.startswith("#HttpOnly_"):
                      line = line[len("#HttpOnly_"):]
                  elif line.startswith("#"):
                      continue
                  parts = line.split("\t")
                  if len(parts) >= 7:
                      cookies.append(f"{parts[5]}={parts[6]}")
          cookie_header = "; ".join(cookies)

          session_id = str(uuid.uuid4())
          ws_url = base.replace("https://", "wss://", 1) + f"/api/kernels/{kid}/channels?session_id={session_id}"
          ws = websocket.create_connection(
              ws_url,
              cookie=cookie_header,
              origin=base,
              timeout=20,
          )

          code = r'''
          import os, subprocess, json, time

          def running(pattern):
              return subprocess.run(
                  ["pgrep", "-f", pattern],
                  stdout=subprocess.DEVNULL,
                  stderr=subprocess.DEVNULL
              ).returncode == 0

          before = {
              "entrypoint_file": os.path.isfile("/workspace/rdc-entrypoint.sh"),
              "pre_start_file": os.path.isfile("/workspace/pre_start_rdc.sh"),
              "auth_backup_dir": os.path.isdir("/workspace/.rdc-auth-backup"),
              "auth_device_file": os.path.isfile("/workspace/.rdc-auth-backup/device.json"),
              "rdc_process": running("desktop-commander"),
              "rdc_watchdog_process": running("rdc-watchdog"),
              "supervisor_process": running("runpod-supervisor"),
          }
          print("SAFE_BEFORE " + json.dumps(before, sort_keys=True))

          launched = False
          if before["pre_start_file"] and before["auth_device_file"] and not before["rdc_process"]:
              subprocess.Popen(
                  ["bash", "/workspace/pre_start_rdc.sh"],
                  stdout=subprocess.DEVNULL,
                  stderr=subprocess.DEVNULL,
                  stdin=subprocess.DEVNULL,
                  start_new_session=True,
              )
              launched = True
              time.sleep(6)

          after = {
              "rdc_process": running("desktop-commander"),
              "rdc_watchdog_process": running("rdc-watchdog"),
              "supervisor_process": running("runpod-supervisor"),
          }
          print("SAFE_LAUNCHED " + json.dumps(launched))
          print("SAFE_AFTER " + json.dumps(after, sort_keys=True))

          node_total = 0
          rdc_cwd_nodes = 0
          rdc_cmd_nodes = 0
          for name in os.listdir("/proc"):
              if not name.isdigit():
                  continue
              pid = name
              try:
                  with open(f"/proc/{pid}/comm", "r", encoding="utf-8", errors="ignore") as f:
                      comm = f.read().strip()
                  if comm != "node":
                      continue
                  node_total += 1
                  try:
                      cwd = os.readlink(f"/proc/{pid}/cwd")
                  except Exception:
                      cwd = ""
                  try:
                      with open(f"/proc/{pid}/cmdline", "rb") as f:
                          cmd = f.read().replace(b"\x00", b" ").decode("utf-8", "ignore")
                  except Exception:
                      cmd = ""
                  if "rdc-agent" in cwd:
                      rdc_cwd_nodes += 1
                  if any(x in cmd.lower() for x in ["desktop-commander", "rdc-agent", "@wonderwhy-er"]):
                      rdc_cmd_nodes += 1
              except Exception:
                  continue
          print("SAFE_PROCESS_DIAG " + json.dumps({
              "node_total": node_total,
              "rdc_cwd_nodes": rdc_cwd_nodes,
              "rdc_cmd_nodes": rdc_cmd_nodes,
          }, sort_keys=True))

          import hashlib
          backup = "/workspace/.rdc-auth-backup/device.json"
          def digest(path):
              try:
                  h = hashlib.sha256()
                  with open(path, "rb") as f:
                      for chunk in iter(lambda: f.read(65536), b""):
                          h.update(chunk)
                  return h.hexdigest()
              except Exception:
                  return None

          backup_hash = digest(backup)
          live_candidates = []
          for root, dirs, files in os.walk("/root"):
              rel_depth = root[len("/root"):].count(os.sep)
              if rel_depth > 4:
                  dirs[:] = []
                  continue
              if "device.json" in files and any(x in root.lower() for x in ["desktop", "commander", "rdc"]):
                  path = os.path.join(root, "device.json")
                  live_candidates.append({
                      "path_basename": os.path.basename(root),
                      "matches_backup": bool(backup_hash and digest(path) == backup_hash),
                  })
          print("SAFE_AUTH_DIAG " + json.dumps({
              "backup_present": bool(backup_hash),
              "live_candidate_count": len(live_candidates),
              "any_live_matches_backup": any(x["matches_backup"] for x in live_candidates),
              "candidate_dir_basenames": sorted(set(x["path_basename"] for x in live_candidates)),
          }, sort_keys=True))

          import shutil, re
          agent = "/workspace/factory-runtime/rdc-agent"
          dist = os.path.join(agent, "node_modules", "@wonderwhy-er", "desktop-commander", "dist")
          runtime_diag = {
              "node_path_present": bool(shutil.which("node")),
              "npm_path_present": bool(shutil.which("npm")),
              "npx_path_present": bool(shutil.which("npx")),
              "agent_dir": os.path.isdir(agent),
              "agent_package_json": os.path.isfile(os.path.join(agent, "package.json")),
              "agent_node_modules": os.path.isdir(os.path.join(agent, "node_modules")),
              "commander_dist_dir": os.path.isdir(dist),
              "commander_dist_js_count": len([x for x in os.listdir(dist) if x.endswith(".js")]) if os.path.isdir(dist) else 0,
          }
          print("SAFE_RUNTIME_DIAG " + json.dumps(runtime_diag, sort_keys=True))

          import shutil as _shutil
          used_before = _shutil.disk_usage("/workspace").used
          agent_entries_before = len(os.listdir(agent)) if os.path.isdir(agent) else 0
          time.sleep(8)
          used_after = _shutil.disk_usage("/workspace").used
          agent_entries_after = len(os.listdir(agent)) if os.path.isdir(agent) else 0
          print("SAFE_MIGRATION_PROGRESS " + json.dumps({
              "workspace_used_gib_before": round(used_before / (1024**3), 3),
              "workspace_used_gib_after": round(used_after / (1024**3), 3),
              "workspace_delta_mib": round((used_after - used_before) / (1024**2), 3),
              "rdc_agent_entries_before": agent_entries_before,
              "rdc_agent_entries_after": agent_entries_after,
              "unreal_dir_present": os.path.isdir("/workspace/factory-runtime/UnrealEngine-5.8.2"),
              "comfy_dir_present": os.path.isdir("/workspace/factory-runtime/ComfyUI"),
              "hunyuandir_present": os.path.isdir("/workspace/factory-runtime/Hunyuan3D-2"),
          }, sort_keys=True))

          log_files = []
          for base in ["/workspace", "/tmp"]:
              for root, dirs, files in os.walk(base):
                  depth = root[len(base):].count(os.sep)
                  if depth > 3:
                      dirs[:] = []
                      continue
                  dirs[:] = [d for d in dirs if d not in {"node_modules", "UnrealEngine-5.8.2", ".git"}]
                  for fn in files:
                      low = fn.lower()
                      if any(k in low for k in ["rdc", "commander", "watchdog"]) and (low.endswith(".log") or low.endswith(".txt") or low.endswith(".out")):
                          path = os.path.join(root, fn)
                          try:
                              size = os.path.getsize(path)
                          except Exception:
                              size = -1
                          log_files.append((path, size))
          print("SAFE_LOG_FILES " + json.dumps([
              {"path": p, "size": s} for p, s in sorted(log_files)
          ], sort_keys=True))

          categories = {
              "node_not_found": re.compile(r"(node|npm|npx): (command )?not found", re.I),
              "module_not_found": re.compile(r"(MODULE_NOT_FOUND|Cannot find module)", re.I),
              "enoent": re.compile(r"ENOENT|No such file or directory", re.I),
              "permission": re.compile(r"EACCES|Permission denied", re.I),
              "unauthorized": re.compile(r"unauthori[sz]ed|HTTP[^\n]*(401|403)|\b(401|403)\b", re.I),
              "npm_error": re.compile(r"npm ERR", re.I),
              "syntax_error": re.compile(r"SyntaxError", re.I),
          }
          classified = []
          for path, size in log_files:
              try:
                  with open(path, "r", encoding="utf-8", errors="ignore") as f:
                      data = f.read()[-200000:]
                  classified.append({
                      "path": path,
                      **{name: bool(rx.search(data)) for name, rx in categories.items()}
                  })
              except Exception:
                  pass
          print("SAFE_LOG_CLASSIFICATION " + json.dumps(classified, sort_keys=True))
          '''

          msg_id = str(uuid.uuid4())
          msg = {
              "header": {
                  "msg_id": msg_id,
                  "username": "github-actions",
                  "session": session_id,
                  "date": datetime.datetime.now(datetime.timezone.utc).isoformat(),
                  "msg_type": "execute_request",
                  "version": "5.3",
              },
              "parent_header": {},
              "metadata": {},
              "content": {
                  "code": code,
                  "silent": False,
                  "store_history": False,
                  "user_expressions": {},
                  "allow_stdin": False,
                  "stop_on_error": True,
              },
              "buffers": [],
              "channel": "shell",
          }
          ws.send(json.dumps(msg))

          deadline = time.time() + 40
          saw_idle = False
          while time.time() < deadline and not saw_idle:
              raw = ws.recv()
              data = json.loads(raw)
              parent = data.get("parent_header", {})
              if parent.get("msg_id") != msg_id:
                  continue
              mtype = data.get("msg_type") or data.get("header", {}).get("msg_type")
              content = data.get("content", {})
              if mtype == "stream":
                  text = content.get("text", "")
                  for line in text.splitlines():
                      if line.startswith("SAFE_"):
                          print(line)
              elif mtype == "error":
                  print("SAFE_EXECUTION_ERROR " + json.dumps({
                      "ename": content.get("ename"),
                      "evalue": content.get("evalue"),
                  }))
              elif mtype == "status" and content.get("execution_state") == "idle":
                  saw_idle = True

          ws.close()
          if not saw_idle:
              raise SystemExit("Jupyter repair command did not reach idle state")
          PY
          python /tmp/jupyter_repair.py

      - name: Close successful repair request
        if: success() && github.event_name == 'issues'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh issue close "${{ github.event.issue.number }}" \
            --repo "${{ github.repository }}" \
            --comment "Commander repair diagnostic completed on migrated Pod f72o8q67mc0lr7."
