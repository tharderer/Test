name: RunPod Migration Discovery

on:
  workflow_dispatch:
  issues:
    types: [opened]

permissions:
  contents: read
  issues: write

jobs:
  discover:
    if: >
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'issues' &&
       github.actor == 'tharderer' &&
       github.event.issue.user.login == 'tharderer' &&
       github.event.issue.title == '[RUNPOD MIGRATION] DISCOVER')
    runs-on: ubuntu-latest
    steps:
      - name: Validate credential
        env:
          RUNPOD_API_KEY: ${{ secrets.RUNPOD_API_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          [[ -n "$RUNPOD_API_KEY" ]] || { echo "::error::Missing RUNPOD_API_KEY"; exit 2; }

      - name: List safe Pod state
        env:
          RUNPOD_API_KEY: ${{ secrets.RUNPOD_API_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error \
            --url "https://api.runpod.io/v2/pods" \
            --header "Authorization: Bearer $RUNPOD_API_KEY" \
            --output /tmp/pods.json

          jq '{
            pods: [
              .pods[] | {
                id,
                name,
                status,
                createdAt
              }
            ]
          }' /tmp/pods.json

      - name: Inspect migrated Pod safe configuration
        env:
          RUNPOD_API_KEY: ${{ secrets.RUNPOD_API_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          for pod_id in "togka5pqf0efbh" "f72o8q67mc0lr7"; do
            curl --fail --silent --show-error \
              --url "https://rest.runpod.io/v1/pods/$pod_id" \
              --header "Authorization: Bearer $RUNPOD_API_KEY" \
              --output "/tmp/$pod_id.json"
            jq '{
              id,
              name,
              desiredStatus,
              imageName,
              containerDiskInGb,
              volumeInGb,
              volumeMountPath,
              dockerArgs,
              containerStartCommand,
              ports,
              portMappings,
              publicIp,
              machineId,
              lastStatusChange,
              costPerHr
            }' "/tmp/$pod_id.json"
          done

      - name: Compare safe GraphQL startup configuration
        env:
          RUNPOD_API_KEY: ${{ secrets.RUNPOD_API_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          for pod_id in "togka5pqf0efbh" "f72o8q67mc0lr7"; do
            query='query { pod(input: { podId: "'"$pod_id"'" }) { id name desiredStatus dockerArgs imageName volumeInGb volumeMountPath locked } }'
            curl --fail --silent --show-error \
              --request POST \
              --header 'content-type: application/json' \
              --url "https://api.runpod.io/graphql?api_key=$RUNPOD_API_KEY" \
              --data "$(jq -cn --arg q "$query" '{query:$q}')" \
              --output "/tmp/gql-$pod_id.json"
            jq '{pod: .data.pod, errors: [.errors[]? | {message}]}' "/tmp/gql-$pod_id.json"
          done

      - name: Close issue
        if: success() && github.event_name == 'issues'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh issue close "${{ github.event.issue.number }}" \
            --repo "${{ github.repository }}" \
            --comment "Safe RunPod migration discovery completed."
