name: RunPod Zero-GPU Rescue

on:
  workflow_dispatch:
  issues:
    types: [opened]

permissions:
  contents: read
  issues: write

jobs:
  zero-gpu-rescue:
    if: >
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'issues' &&
       github.actor == 'tharderer' &&
       github.event.issue.user.login == 'tharderer' &&
       github.event.issue.title == '[RUNPOD RECOVERY] ZERO GPU')
    runs-on: ubuntu-latest
    steps:
      - name: Validate recovery credential
        env:
          RUNPOD_API_KEY: ${{ secrets.RUNPOD_API_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          [[ -n "$RUNPOD_API_KEY" ]] || { echo "::error::Missing RUNPOD_API_KEY"; exit 2; }

      - name: Resume Pod with zero GPUs
        env:
          RUNPOD_API_KEY: ${{ secrets.RUNPOD_API_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          POD_ID="togka5pqf0efbh"
          query='mutation { podResume(input: { podId: "'"$POD_ID"'", gpuCount: 0 }) { id desiredStatus } }'
          curl --fail --silent --show-error \
            --request POST \
            --header 'content-type: application/json' \
            --url "https://api.runpod.io/graphql?api_key=$RUNPOD_API_KEY" \
            --data "$(jq -cn --arg q "$query" '{query:$q}')" \
            --output /tmp/runpod-zero-gpu.json

          if jq -e '.errors and (.errors|length>0)' /tmp/runpod-zero-gpu.json >/dev/null; then
            echo "::error::RunPod zero-GPU resume failed"
            jq '{errors: [.errors[] | {message}]}' /tmp/runpod-zero-gpu.json
            exit 22
          fi

          jq '{podResume: .data.podResume}' /tmp/runpod-zero-gpu.json
          jq -e '.data.podResume.id == "'"$POD_ID"'" and .data.podResume.desiredStatus == "RUNNING"' /tmp/runpod-zero-gpu.json >/dev/null

      - name: Close successful issue-triggered request
        if: success() && github.event_name == 'issues'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh issue close "${{ github.event.issue.number }}" \
            --repo "${{ github.repository }}" \
            --comment "RunPod accepted zero-GPU recovery for Pod togka5pqf0efbh."
